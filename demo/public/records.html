<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このタブの試し記録</title><style>body{font:16px/1.8 system-ui;max-width:900px;margin:auto;padding:24px;color:#203b3c;background:#f5f4ef}a{color:#17634e}article{background:white;padding:22px;margin:18px 0;border:1px solid #ccd7d0;border-radius:10px}button{padding:10px;font:inherit}pre{white-space:pre-wrap}</style><a href="/demo">デモに戻る</a> · <a href="/">作品の説明</a><h1>このタブの試し記録</h1><p>記録はこのタブにだけ一時保存します。他の閲覧者とは共有しません。タブを閉じると消えます。編集後のDOCX出力はデモ画面から行えます。</p><div id="rows"></div><button id="clear">このタブの記録をすべて消す</button><p id="status" role="status"></p><script>const key='consultation-demo-records-v1';function draw(){const root=document.getElementById('rows');root.replaceChildren();const rows=JSON.parse(sessionStorage.getItem(key)||'[]');if(!rows.length)root.textContent='まだ記録はありません。デモ画面で記録簿をDOCX出力すると、ここへ一時保存します。';for(const r of rows){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('pre'),link=document.createElement('a');h.textContent=r.data.subject;p.textContent=(r.data.displayDate||'日付未設定')+'／版 '+r.revision+'\n'+r.data.consultation+'\n\n'+r.data.response;link.textContent='確認・再編集';link.href='/demo?record='+encodeURIComponent(r.id);a.append(h,p,link);root.append(a);}}document.getElementById('clear').onclick=()=>{if(confirm('このタブの記録をすべて消しますか？')){sessionStorage.removeItem(key);draw();document.getElementById('status').textContent='消去しました。';}};draw();</script></html>
